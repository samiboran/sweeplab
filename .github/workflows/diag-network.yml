name: Network diagnostic (one-off)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Set up venv and deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -U pip
          .venv/bin/pip install -q datasets pandas pyarrow

      - name: Inspect polymarket dataset schema
        run: |
          cat <<'PY' > inspect.py.raw
          from datasets import get_dataset_config_names, load_dataset_builder, load_dataset

          repo = "kachoio/polymarket-5-minute-crypto-up-down-markets"

          print("=== configs ===")
          try:
              print(get_dataset_config_names(repo))
          except Exception as e:
              print("get_dataset_config_names failed:", e)

          for config in ["ticks", "markets"]:
              print(f"\n=== builder info: {config} ===")
              try:
                  b = load_dataset_builder(repo, config)
                  print("splits:", list(b.info.splits.keys()) if b.info.splits else None)
                  print("features:", b.info.features)
                  if b.info.splits:
                      for name, sp in b.info.splits.items():
                          print(f"  split={name} num_examples={sp.num_examples} num_bytes={sp.num_bytes}")
              except Exception as e:
                  print("load_dataset_builder failed:", e)

          for config, split in [("ticks", "btc"), ("markets", "btc")]:
              print(f"\n=== streaming sample: {config}/{split} ===")
              try:
                  ds = load_dataset(repo, config, split=split, streaming=True)
                  for i, row in enumerate(ds):
                      print(row)
                      if i >= 4:
                          break
              except Exception as e:
                  print("streaming sample failed:", e)
          PY
          python3 -c "import textwrap,pathlib; pathlib.Path('inspect.py').write_text(textwrap.dedent(pathlib.Path('inspect.py.raw').read_text()))"
          .venv/bin/python3 inspect.py
