name: Network diagnostic (one-off)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect raw Binance kline CSV format
        run: |
          curl -sS -o btc.zip "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1s/BTCUSDT-1s-2026-03.zip"
          unzip -o btc.zip
          f=$(ls BTCUSDT-1s-2026-03*.csv)
          echo "=== file: $f ==="
          head -n 3 "$f"
          echo "=== line count ==="
          wc -l "$f"
          echo "=== checksum file if any ==="
          curl -sS "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1s/BTCUSDT-1s-2026-03.zip.CHECKSUM" || true
