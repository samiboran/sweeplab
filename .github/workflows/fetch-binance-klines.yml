name: Fetch Binance klines (one-off data pull)

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch klines from Binance and write CSVs
        run: |
          mkdir -p data
          cat <<'PY' > fetch.py.raw
          import csv
          import json
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime, timedelta, timezone

          SYMBOLS = ["BTCUSDT", "ETHUSDT", "AVAXUSDT", "SOLUSDT"]
          # (interval, months of lookback)
          INTERVALS = [("5m", 6), ("1h", 12)]
          BASE = "https://api.binance.com/api/v3/klines"
          LIMIT = 1000

          def fetch_page(symbol, interval, start_ms, end_ms):
              url = f"{BASE}?symbol={symbol}&interval={interval}&startTime={start_ms}&endTime={end_ms}&limit={LIMIT}"
              for attempt in range(6):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "sweeplab-data-fetch"})
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return json.loads(resp.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code in (418, 429):
                          wait = int(e.headers.get("Retry-After", "5"))
                          print(f"rate limited ({e.code}), sleeping {wait}s")
                          time.sleep(wait)
                          continue
                      print(f"HTTPError {e.code} on attempt {attempt}: {e.read()[:300]}")
                      time.sleep(2 * (attempt + 1))
                  except Exception as e:
                      print(f"error on attempt {attempt}: {e}")
                      time.sleep(2 * (attempt + 1))
              raise RuntimeError(f"failed to fetch {symbol} {interval} after retries")

          def fetch_all(symbol, interval, months):
              end = datetime.now(timezone.utc)
              start = end - timedelta(days=30 * months)
              start_ms = int(start.timestamp() * 1000)
              end_ms = int(end.timestamp() * 1000)
              rows = []
              cursor = start_ms
              while cursor < end_ms:
                  batch = fetch_page(symbol, interval, cursor, end_ms)
                  if not batch:
                      break
                  rows.extend(batch)
                  last_close_time = batch[-1][6]
                  next_cursor = last_close_time + 1
                  if next_cursor <= cursor:
                      break
                  cursor = next_cursor
                  if len(batch) < LIMIT:
                      break
                  time.sleep(0.25)
              return rows

          def write_csv(symbol, interval, rows):
              path = f"data/{symbol}_{interval}.csv"
              seen = set()
              with open(path, "w", newline="") as f:
                  w = csv.writer(f)
                  w.writerow(["datetime", "open", "high", "low", "close", "volume", "quote_volume"])
                  for r in rows:
                      open_time_ms = r[0]
                      if open_time_ms in seen:
                          continue
                      seen.add(open_time_ms)
                      dt = datetime.fromtimestamp(open_time_ms / 1000, tz=timezone.utc).strftime("%Y-%m-%d %H:%M:%S")
                      w.writerow([dt, r[1], r[2], r[3], r[4], r[5], r[7]])
              print(f"wrote {path}: {len(seen)} rows")

          for symbol in SYMBOLS:
              for interval, months in INTERVALS:
                  print(f"fetching {symbol} {interval} ({months}mo)...")
                  rows = fetch_all(symbol, interval, months)
                  write_csv(symbol, interval, rows)
          PY
          python3 -c "import textwrap,pathlib; pathlib.Path('fetch.py').write_text(textwrap.dedent(pathlib.Path('fetch.py.raw').read_text()))"
          python3 fetch.py
          echo "---- summary ----"
          wc -l data/*.csv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binance-klines
          path: data/*.csv
          retention-days: 3
