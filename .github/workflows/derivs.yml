name: derivs-snapshot
on:
  push:
    branches: [data-feed]
    paths: [tools/fetch_derivs.py, .github/workflows/derivs.yml, data/derivs/.trigger]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_derivs.py
      - run: |
          git config user.name "derivs-bot"
          git config user.email "derivs-bot@users.noreply.github.com"
          git add data/derivs/*.json
          git commit -m "derivs snapshot $(date -u +%F_%H)" || echo nothing
          git push
