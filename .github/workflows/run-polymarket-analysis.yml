name: Polymarket BTC lag analysis (one-off)

on:
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up venv and deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -U pip
          .venv/bin/pip install -q datasets pandas pyarrow scipy matplotlib

      - name: Download BTC 1s klines (Binance bulk data)
        run: |
          mkdir -p data
          cd data
          for month in 2026-03 2026-04 2026-05; do
            url="https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1s/BTCUSDT-1s-${month}.zip"
            echo "downloading $url"
            curl -sS -f -o "BTCUSDT-1s-${month}.zip" "$url"
          done
          ls -la

      - name: Run analysis
        run: .venv/bin/python3 .github/workflows/_scripts/polymarket_lag_analysis.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-lag-analysis
          path: out/
          retention-days: 5
