name: Publish analysis artifact to repo (one-off)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID whose artifact to publish"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: polymarket-lag-analysis
          path: _artifact_out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit artifact contents into repo
        run: |
          mkdir -p artifacts/polymarket-lag-analysis
          cp -v _artifact_out/* artifacts/polymarket-lag-analysis/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/polymarket-lag-analysis
          git commit -m "Publish polymarket-lag-analysis artifact (run ${{ inputs.run_id }})"
          git push
