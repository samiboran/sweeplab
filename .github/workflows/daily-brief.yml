# Every morning ~09:00 Istanbul (06:00 UTC; Turkey has no DST): pull derivatives,
# macro and calendar data, score it, store the files on the `data-feed` branch and
# send the summary to the SweepLab bot's Telegram chat.
# Needs repo secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID (same values as bot/.env).
name: daily-brief
on:
  schedule:
    - cron: "50 5 * * *"   # GitHub queues scheduled runs; starting at 05:50 UTC lands near 09:00
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/**, .github/workflows/daily-brief.yml]
permissions:
  contents: write
concurrency:
  group: daily-brief
  cancel-in-progress: false
jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: feed/data/derivs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data-feed
          path: feed
      - name: Live snapshot (OKX, Hyperliquid)
        run: python3 tools/fetch_derivs.py
      - name: OKX daily history (1y price, 30d positioning)
        run: python3 tools/fetch_okx_history.py
      - name: Estimated liquidation map (OKX OI 4h, 45 days)
        run: python3 tools/liq_map.py || echo "liq map failed"
      - name: Four-layer dataset (60 days shown; z-scores still use 30)
        env:
          SHOW_DAYS: "60"
        run: python3 tools/build_notebook.py
      - name: Z-scores, alarms, Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: ${{ github.event_name == 'push' && '0' || '1' }}
        run: python3 tools/daily_brief.py
      - name: Store data on data-feed
        working-directory: feed
        run: |
          git config user.name "derivs-bot"
          git config user.email "derivs-bot@users.noreply.github.com"
          git add data/derivs/
          git commit -m "daily brief $(date -u +%F)" || echo "no changes"
          git push origin HEAD:data-feed

  # ---- Piyasa Hava Durumu: public showcase deploy (docs/DEPLOY_PLAN.md) ----
  # Only the static site (piyasa/) and derived data (data-feed:data/site/) leave the
  # repo. Each deploy job is skipped unless its secrets exist; values are never printed.
  site-deploy-check:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      repo: ${{ steps.c.outputs.repo }}
      cloudflare: ${{ steps.c.outputs.cloudflare }}
    steps:
      - id: c
        env:
          T1: ${{ secrets.SITE_DEPLOY_TOKEN }}
          T2: ${{ secrets.SITE_DEPLOY_REPO }}
          C1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          C2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$T1" ] && [ -n "$T2" ]; then echo "repo=true" >> "$GITHUB_OUTPUT"; else echo "repo=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$C1" ] && [ -n "$C2" ]; then echo "cloudflare=true" >> "$GITHUB_OUTPUT"; else echo "cloudflare=false" >> "$GITHUB_OUTPUT"; fi

  deploy-repo:   # option C: separate public repo (SITE_DEPLOY_TOKEN + SITE_DEPLOY_REPO)
    needs: [brief, site-deploy-check]
    if: ${{ !cancelled() && needs.site-deploy-check.outputs.repo == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: piyasa
      - uses: actions/checkout@v4
        with:
          ref: data-feed
          path: feed
          sparse-checkout: data/site
      - name: Assemble showcase (piyasa/ + data/site/ only)
        run: |
          set -e
          rm -rf dist && mkdir -p dist/data
          cp -R piyasa/. dist/
          if [ -d feed/data/site ]; then cp -R feed/data/site dist/data/site; fi
          if grep -rIlE 'ghp_|github_pat_|xox[bp]-|BEGIN [A-Z ]*PRIVATE KEY|[0-9]{8,10}:[A-Za-z0-9_-]{35}' dist; then
            echo "secret-like string found in showcase; aborting"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SITE_DEPLOY_REPO }}
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          path: target
      - name: Push to showcase repo
        working-directory: target
        run: |
          cp -R ../dist/. .
          git config user.name "piyasa-bot"
          git config user.email "piyasa-bot@users.noreply.github.com"
          git add -A
          git commit -m "site $(date -u +%F)" || echo "no changes"
          git push

  deploy-cloudflare:   # option A (recommended): Cloudflare Pages direct upload
    needs: [brief, site-deploy-check]
    if: ${{ !cancelled() && needs.site-deploy-check.outputs.cloudflare == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: piyasa
      - uses: actions/checkout@v4
        with:
          ref: data-feed
          path: feed
          sparse-checkout: data/site
      - name: Assemble showcase (piyasa/ + data/site/ only)
        run: |
          set -e
          rm -rf dist && mkdir -p dist/data
          cp -R piyasa/. dist/
          if [ -d feed/data/site ]; then cp -R feed/data/site dist/data/site; fi
          if grep -rIlE 'ghp_|github_pat_|xox[bp]-|BEGIN [A-Z ]*PRIVATE KEY|[0-9]{8,10}:[A-Za-z0-9_-]{35}' dist; then
            echo "secret-like string found in showcase; aborting"; exit 1; fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'piyasa-hava-durumu' }} --branch=main
