# Every morning ~09:00 Istanbul (06:00 UTC; Turkey has no DST): pull derivatives,
# macro and calendar data, score it, store the files on the `data-feed` branch and
# send the summary to the SweepLab bot's Telegram chat.
# Needs repo secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID (same values as bot/.env).
name: daily-brief
on:
  schedule:
    - cron: "50 5 * * *"   # GitHub queues scheduled runs; starting at 05:50 UTC lands near 09:00
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/**, .github/workflows/daily-brief.yml]
permissions:
  contents: write
concurrency:
  group: daily-brief
  cancel-in-progress: false
jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: feed/data/derivs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data-feed
          path: feed
      - name: Live snapshot (OKX, Hyperliquid)
        run: python3 tools/fetch_derivs.py
      - name: OKX daily history (1y price, 30d positioning)
        run: python3 tools/fetch_okx_history.py
      - name: Four-layer dataset
        run: python3 tools/build_notebook.py
      - name: Z-scores, alarms, Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: ${{ github.event_name == 'push' && '0' || '1' }}
        run: python3 tools/daily_brief.py
      - name: Store data on data-feed
        working-directory: feed
        run: |
          git config user.name "derivs-bot"
          git config user.email "derivs-bot@users.noreply.github.com"
          git add data/derivs/
          git commit -m "daily brief $(date -u +%F)" || echo "no changes"
          git push origin HEAD:data-feed
